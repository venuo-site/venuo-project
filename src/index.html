<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venuo - Descubra. Conecte. Viva!</title>
    <link rel="stylesheet" href="css/style.css"> <!-- Estilo Padrão -->
    <link rel="stylesheet" href="css/header.css"> <!-- Estilo do Header -->
    <link rel="stylesheet" href="css/hero.css"> <!-- Estilo do Hero -->
    <link rel="stylesheet" href="css/highlights.css"> <!-- Estilo dos Destaques -->
    <link rel="stylesheet" href="css/categories.css"> <!-- Estilo Seção de Categorias -->
    <link rel="stylesheet" href="css/footer.css"> <!-- Estilo do Footer -->
    <link rel="stylesheet" href="css/auth.css"> <!-- Estilo do Modal de Login -->
    <link rel="stylesheet" href="css/cadastro.css"> <!-- Adicione aqui -->
    <link rel="stylesheet" href="css/sobre.css"> <!-- Estilo da pagina Sobre o Projeto -->
    <link rel="stylesheet" href="css/detalhes.css"> <!--Estilo da pagina sobre detalhes do estabelecimento-->
    <link rel="stylesheet" href="css/results.css">
    <link rel="stylesheet" href="css/filtros-busca.css"> <!-- Estilo do Modal de Filtros -->

    <!-- Biblioteca dos Icones (temporario) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="dark-theme"> 

    <!-- 1. O Header agora atua como a BARRA LATERAL (Esquerda) -->
    <!-- (Transformei em <aside> por semântica, mas mantive o ID para o seu JS não quebrar) -->
    <aside id="header-container"></aside> 

    <!-- 2. Conteúdo Principal (Direita) -->
    <main> 
        <!-- Modais de Sobreposição -->
        <div id="login-container" class="view-container" style="display: none;"></div> 
        <div id="cadastro-container" class="view-container" style="display: none;"></div> 
        
        <!-- Telas da Aplicação (Injetadas via JS) -->
        <div id="hero-container" class="view-container"></div> 
        <div id="highlights-container" class="view-container"></div> 
        
        <!-- <div id="categories-container" class="view-container"></div>  -->
        
        <div id="results-container" class="view-container"></div> 
        
        <div id="about-container" class="view-container" style="display: none;"></div> 
    </main>

    <!-- O footer pode ser injetado dentro do main depois, ou removido no novo design -->
    <div id="footer-container" style="display: none;"></div>

    <script type="module" src="js/script.js"></script> 
</body>
</html>

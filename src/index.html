<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venuo - Descubra. Conecte. Viva!</title>
    <link rel="stylesheet" href="css/style.css">

    <!-- biblioteca dos icones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<!-- usei a classe dark para facilitar fazer um tema claro no futuro -->
<body class="dark-theme">

    <!-- barra de navegacaoo -->
    <header class="navbar">
        <div class="logo">
            <img src="assets/logo-venuo.png" alt="Logo Venuo">
        </div>
        <!-- botoes de acao -->
        <nav class="nav-actions">
            <button class="icon-btn" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
            <button class="icon-btn" aria-label="Perfil"><i class="fa-regular fa-user"></i></button>
            <button class="icon-btn" aria-label="Alterar Tema"><i class="fa-solid fa-moon"></i></button>
        </nav>
    </header>

    <!-- conteudo principal -->
    <main>
        <!-- hero section (titulo lindo e busca) -->
        <section class="hero-section">
            <h1 class="main-title">
                <span class="text-orange">Descubra.</span>
                <span class="text-blue">Conecte.</span>
                <span class="text-white">Viva.</span>
            </h1>
            <p class="subtitle">Encontre seu lazer ideal em segundos.</p>

            <!-- barra de pesquisa maneira -->
            <div class="search-container">
                <button class="add-btn"><i class="fa-solid fa-plus"></i></button>
                <input type="text" placeholder="Para onde vamos hoje?" id="searchInput">
                <div class="search-actions">
                    <button class="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
                    <button class="mic-btn"><i class="fa-solid fa-microphone"></i></button>
                    <button class="location-btn"><i class="fa-solid fa-location-crosshairs"></i></button>
                </div>
            </div>


        </section>
    </main>
</body>
</html>

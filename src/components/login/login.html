<section class="modal-overlay">
    <div class="modal-box">
        <!-- Botão de fechar -->
        <button class="close-button" onclick="fecharModalLogin()"><i class="fa fa-times"></i></button>

        <div class="modal-header">
            <h2 class="login-title">Bem-vindo de volta</h2>
            <p>Acesse sua conta Venuo para continuar</p>
        </div>

        <div class="input-group">
            <label class="input-title">E-mail ou celular</label>
            <input type="text" id="input-access" placeholder="Digite seu e-mail">
        </div>

        <div class="input-group">
            <label class="input-title">Senha</label>
            <input type="password" id="input-senha" placeholder="Sua senha secreta">
        </div>

        <button class="login-button">Entrar no rolê</button>

        <p class="p-divisoria"><span>Ou</span></p>

        <button class="google-login-button">
            <i class="fab fa-google"></i> Continuar com Google
        </button>

        <p class="footer-register">Não tem uma conta? 
                <button class="link-button" onclick="fecharModalLogin(); navegarPara('cadastro-container', 'components/cadastro/cadastro.html)">
                Cadastre-se
            </button>
        </p>
    </div>
</section>

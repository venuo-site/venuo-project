
<!-- ========================================
          PERFIL DO USUÁRIO
          CABEÇALHO DO PERFIL
     ======================================== -->

<!-- Container principal da tela SPA -->
<div class="view-container profile-container"
     id="perfil-container"
     style="display: none;">

    <!-- Cabeçalho com foto e informações do usuário -->
    <section class="profile-header">

        <!-- Foto de perfil -->
        <img
            src="src/img/perfil-usuario.png"
            alt="Foto de perfil de João Silva"
            class="profile-header__photo"
        >

        <!-- Dados pessoais do usuário -->
        <div class="profile-header__info">

            <!-- Nome completo -->
            <h1 class="profile-header__name">
                João Silva
            </h1>

            <!-- E-mail -->
            <p class="profile-header__email">
                joao.silva@email.com
            </p>

            <!-- Telefone -->
            <p class="profile-header__phone">
                (11) 98765-4321
            </p>

            <!-- Data de entrada na plataforma -->
            <p class="profile-header__member">
                <i class="fa-regular fa-calendar" aria-hidden="true"></i>
                Membro desde Janeiro 2024
            </p>

        </div>

        <!-- Botão para sair da conta -->
        <button
            type="button"
            class="profile-header__logout"
            id="perfil-sair">

            <i class="fa-solid fa-arrow-right-from-bracket"
               aria-hidden="true"></i>

            Sair
        </button>

    </section>

</div>

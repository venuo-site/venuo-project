<!-- barra de navegacaoo -->
<header class="navbar">
    <!-- logo -->
    <div class="logo">
        <img src="./img/logo-venuo-mod.png" alt="Logo Venuo">
    </div>

    <!-- pesquisa -->
    <div class="search-container-header">
        <button class="add-btn"><i class="fa-solid fa-plus"></i></button>
        <input type="text" placeholder="Para onde vamos hoje?" id="searchInput">
        <div class="search-actions">
            <button class="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>

    <!-- botoes de acao -->
    <nav class="nav-actions">
        <button class="icon-btn" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
        <button class="icon-btn" aria-label="Perfil"><i class="fa-regular fa-user"></i></button>

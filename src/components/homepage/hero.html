<div class="hero-content">
    <h1 class="hero-title"><span class="highlight-orange">Descubra.</span> <span class="highlight-blue">Conecte.</span> <span class="highlight-white">Viva.</span></h1>
    <p class="hero-description">Encontre seu lazer ideal em segundos.</p>

    <!-- barra de busca unificada -->
    <div class="search-bar-container">
        <i class="fa fa-search search-icon"></i>
        <input type="text" placeholder="Busque um lugar, uma vibe ou um bairro..." id="searchInput">
        <span class="location-text">Goiânia, GO</span>
        <!-- Apenas adicionada a chamada onclick="abrirModalFiltros()" -->
        <button class="filter-btn" onclick="abrirModalFiltros()">
            <i class="fa fa-sliders-h"></i> Filtros
        </button>

        <!-- Container onde o modal de filtros flutuante é renderizado dinamicamente -->
        <div id="filtros-container"></div>


    </div>

    <!-- abas de categorias (Filtros Rápidos) -->
    <div class="category-tabs">
        <button class="tab-btn active"><i class="fa fa-compass"></i> Todos</button>
        <button class="tab-btn"><i class="fa fa-wine-glass"></i> Bares</button>
        <button class="tab-btn"><i class="fa fa-utensils"></i> Restaurantes</button>
        <button class="tab-btn"><i class="fa fa-music"></i> Música ao vivo</button>
        <button class="tab-btn"><i class="fa fa-coffee"></i> Cafés</button>
        <button class="tab-btn"><i class="fa fa-tree"></i> Ao ar livre</button>
    </div>
</div>

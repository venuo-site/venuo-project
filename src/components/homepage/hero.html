<section class="hero-sect">
    <!-- titulo principal -->
    <h1 class="main-title">
        <span class="text-orange">Descubra.</span>
        <span class="text-blue">Conecte.</span>
        <span class="text-white">Viva.</span>
    </h1>
    <p class="subtitle">Encontre seu lazer ideal em segundos.</p>

    <!-- barra de pesquisa maneira -->
    <div class="search-container">

        <!-- onclick aqui para abrir o modal de filtros -->
        <button class="add-btn" onclick="abrirModalFiltros()"><i class="fa-solid fa-plus"></i></button>
        <div id="filtros-container" style="display: none;"></div>
        <input type="text" placeholder="Para onde vamos hoje?" id="searchInput">
        <div class="search-actions">
            <button class="search-btn" onclick="navegarPara('results-container', 'components/results/resultados.html')"><i class="fa-solid fa-magnifying-glass"></i></button>
            <button class="mic-btn"><i class="fa-solid fa-microphone"></i></button>
            <button class="location-btn"><i class="fa-solid fa-location-crosshairs"></i></button>
        </div>
    </div>

    <!-- filtros em "pilulas" -->
    <div class="filters">
        <button class="filter-pill">Bares</button>
        <button class="filter-pill">Restaurantes</button>
        <button class="filter-pill">Eventos</button>
        <button class="filter-pill">Cafés</button>
    </div>
</section>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Venuo Footer</title>
  <!-- Importa o seu arquivo CSS externo -->
  <link rel="stylesheet" href="../../css/footer.css">
</head>
<body>

  <!-- FOOTER -->
  <footer class="footer">
    
    <!-- Logo do Footer -->
    <img 
      src="../../img/logo-venuo-mod.png" 
      alt="Logo Venuo" 
      class="footer-logo"
    >

    <!-- Slogan -->
    <p class="footer-slogan">
      Descubra. Conecte. Viva.
    </p>

    <!-- Ícones Sociais -->
    <div class="social-links">
      
      <!-- GitHub -->

      <!-- âncora onde define o link github-->
      <a href="https://github.com/" class="social-button" aria-label="GitHub" target="_blank" rel="noopener noreferrer">
        <!-- Tag para modelagem do ícone do github via código-->
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <!--Tag para ferramenta de desenho livre SVG-->
          <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"></path>
          <!--Tag para ferramenta de desenho livre SVG-->
          <path d="M9 18c-4.51 2-5-2-7-2"></path>
        </svg>
      </a>

      <!-- LinkedIn -->

      <!-- âncora onde define o link linkedin-->
      <a href="https://br.linkedin.com/" class="social-button" aria-label="LinkedIn" target="_blank" rel="noopener noreferrer">
        <!-- Tag para modelagem do ícone do linkedin via código-->
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <!-- Tag para ferramenta de desenho livre SVG-->
          <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>
          <!-- Tag para inserção de formas prontas retangulares-->
          <rect width="4" height="12" x="2" y="9"></rect>
          <!-- Tag cria circulos através de coordenadas (Pingo no i da logo linkedin)-->
          <circle cx="4" cy="4" r="2"></circle>
        </svg>
      </a>

      <!-- Email -->

      <!-- âncora onde define o link e-mail-->
      <a href="https://www.google.com/intl/pt-BR/account/about/" class="social-button" aria-label="E-mail" target="_blank" rel="noopener noreferrer">
        <!-- Tag para modelagem do ícone de e-mail via código-->
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <!-- Tag para inserção de formas prontas retangulares-->
          <rect width="20" height="16" x="2" y="4" rx="2"></rect>
          <!-- Tag para ferramenta de desenho livre SVG-->
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
        </svg>
      </a>

    </div>

    <!-- Linha divisória-->
    <hr class="linha-divisoria-footer">

    <!-- Direitos autorais -->
      <p class="Direitos-Autorais">
        © 2026 Venuo — Projeto acadêmico desenvolvido para facilitar a descoberta de lugares.
      </p>

  </footer>

</body>
</html>
